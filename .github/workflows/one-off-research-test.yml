name: One-off Research Test

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/daily-research.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Etsy seasonal scan
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: node scripts/daily-research.mjs
