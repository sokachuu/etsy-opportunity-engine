name: Seasonal Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Etsy seasonal scan
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: node scripts/daily-research.mjs
      - name: Commit research snapshot
        run: |
          git config user.name "seasonal-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update seasonal research snapshot"
          git push
